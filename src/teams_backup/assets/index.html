<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; object-src 'none'; base-uri 'none'">
  <title>Teams Archive</title>
  <link rel="stylesheet" href="archive.css">
</head>
<body>
  <div class="shell">
    <aside class="rail">
      <header class="brand">
        <span class="brand-mark" aria-hidden="true">T/</span>
        <div><strong>Teams Archive</strong><small id="owner">Local backup</small></div>
      </header>
      <label class="search-wrap">
        <span>Search</span>
        <input id="search" type="search" placeholder="Person, chat, or message…" autocomplete="off">
      </label>
      <nav class="filters" aria-label="Filter conversations">
        <button class="filter active" data-type="all">All <span id="count-all">0</span></button>
        <button class="filter" data-type="oneOnOne">One-on-one</button>
        <button class="filter" data-type="group">Groups</button>
        <button class="filter" data-type="meeting">Meetings</button>
      </nav>
      <div id="chat-list" class="chat-list" role="list"></div>
      <footer><span id="export-date"></span><a href="json/archive.json">JSON</a></footer>
    </aside>
    <main id="main" class="main">
      <section class="empty-state">
        <span class="empty-index">01</span>
        <h1>Your conversations,<br>with no expiry date.</h1>
        <p>Pick a chat from the list. Everything you see lives inside this folder.</p>
      </section>
    </main>
  </div>
  <script src="archive-data.js"></script>
  <script src="archive.js"></script>
</body>
</html>
