name: Build packages

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-15
            artifact: teams-backup-macos-arm64
          - os: windows-2022
            artifact: teams-backup-windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install ".[dev]"
      - run: python -m pytest
      - run: python -m PyInstaller --clean --noconfirm teams-backup.spec
      - if: runner.os == 'macOS'
        run: |
          cp packaging/avvia-mac.command dist/avvia-mac.command
          chmod +x dist/avvia-mac.command
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/*
            config.example.json
            README.md
