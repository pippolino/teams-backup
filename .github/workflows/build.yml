name: Build packages

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-15
            artifact: teams-backup-macos-arm64
            dist_path: dist/*
            package_dir: dist
          - os: windows-2022
            artifact: teams-backup-windows-x64
            # The Windows build is onedir, so the payload lives in a folder.
            dist_path: dist/teams-backup/*
            package_dir: dist/teams-backup
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install ".[dev]"
      - run: python -m pytest
      - run: python -m PyInstaller --clean --noconfirm teams-backup.spec
      - if: runner.os == 'macOS'
        run: |
          cp packaging/start-mac.command dist/start-mac.command
          cp config.example.json dist/config.example.json
          cp README.md dist/README.md
          chmod +x dist/start-mac.command
      - if: runner.os == 'Windows'
        shell: pwsh
        run: ./packaging/sign-windows.ps1 -Path dist/teams-backup
        env:
          TEAMS_BACKUP_SIGN_SHA1: ${{ secrets.SIGN_SHA1 }}
          TEAMS_BACKUP_SIGN_SUBJECT: ${{ secrets.SIGN_SUBJECT }}
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # config.json is read from next to the executable, so the example and
          # the README go inside the application folder.
          Copy-Item config.example.json dist/teams-backup/config.example.json
          Copy-Item README.md dist/teams-backup/README.md
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.dist_path }}

      # Everything below runs only for a v* tag, and produces the downloadable
      # assets on the release page. The archives are built on the runner rather
      # than from the artifacts above, because actions/upload-artifact does not
      # preserve the executable bit that the macOS binary needs.
      - name: Create release archive (macOS)
        if: runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/v')
        run: cd "${{ matrix.package_dir }}" && zip -r "$GITHUB_WORKSPACE/${{ matrix.artifact }}.zip" .

      - name: Create release archive (Windows)
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: Compress-Archive -Path "${{ matrix.package_dir }}/*" -DestinationPath "${{ matrix.artifact }}.zip" -Force

      - name: Attach archive to the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Both matrix jobs race to create the release when a tag is pushed
          # without one, so a failed create is expected and ignored. --clobber
          # keeps re-runs idempotent.
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --generate-notes \
            || true
          gh release upload "$GITHUB_REF_NAME" "${{ matrix.artifact }}.zip" --clobber
